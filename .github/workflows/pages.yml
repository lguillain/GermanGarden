name: Deploy GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:format:cloud
      - run: npm run check:format:frontend
      - run: npm run test:cloud
      - run: npm run check:cloud
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.cloud.config.ts
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'Set VITE_SUPABASE_URL in repository variables'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'Set VITE_SUPABASE_PUBLISHABLE_KEY in repository variables'; exit 1; }
          npm run build
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
