# Hand-curated activities for everyday life in a German-speaking country.
# `id` is stable — don't rename once used; word_activities rows point to it.
# Keep `name` short (it fits on the card) and `description` concrete.

- id: doctor
  name: At the doctor
  description: Appointments, symptoms, prescriptions, test results.

- id: pharmacy
  name: Pharmacy
  description: Rezept, side effects, dosage, over-the-counter.

